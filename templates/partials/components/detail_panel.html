<!-- DETAIL PANEL -->
<div
  id="detail-overlay"
  class="detail-overlay"
  onclick="closeDetail()"
></div>
<aside id="detail-panel" class="detail-panel">
  <div class="detail-panel__header">
    <div style="flex: 1; min-width: 0">
      <div class="dp-breadcrumb" id="dp-breadcrumb"></div>
      <h2 id="dp-title"></h2>
      <div id="dp-meta" class="dp-meta-row"></div>
    </div>
    <button
      class="detail-close-btn"
      onclick="closeDetail()"
      aria-label="Fermer"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div id="dp-doc-section" class="detail-section" style="display: none">
    <div class="detail-label">
      <i class="fa-solid fa-file-lines"></i> Documentation
    </div>
    <div id="dp-doc" class="dp-doc-text"></div>
  </div>

  <div id="dp-screenshots-section" class="detail-section" style="display: none">
    <div class="detail-label">
      <i class="fa-regular fa-image"></i> Screenshots
    </div>
    <div id="dp-screenshots" class="dp-screenshots"></div>
  </div>

  <div class="detail-section">
    <div class="detail-label">
      <i class="fa-solid fa-list-check"></i> Exécution des Steps
    </div>
    <div id="dp-timeline" class="dp-timeline"></div>
  </div>
</aside>
